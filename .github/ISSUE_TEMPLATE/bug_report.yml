name: Bug report
description: Report incorrect or unexpected behaviour in aft-mcp
title: "[bug] "
type: Bug
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not paste the contents of your `.env`**, passwords, or anything else from it. For security issues, do not open a public issue; use the private reporting link in `SECURITY.md` instead.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The prompt or tool call that triggers it, and what you did before.
      placeholder: |
        1. Start the server with `uv run python server.py`
        2. Call `get_boards` from Claude Code
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error message or traceback, with credentials and URLs removed.
      render: text
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool involved
      description: The MCP tool name, if the bug is in one tool.
      placeholder: e.g. patch_cards_by_card_id

  - type: input
    id: aft-mcp-version
    attributes:
      label: aft-mcp version or commit
      placeholder: e.g. 0.1.0 or a1b2c3d
    validations:
      required: true

  - type: input
    id: aft-version
    attributes:
      label: AFT version
      description: The version of the AFT instance the server talks to, if you know it.

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Code 2.3, Claude Desktop, Agent SDK
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: e.g. Python 3.14.1 on Windows 11
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
