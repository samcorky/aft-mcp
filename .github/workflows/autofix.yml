name: autofix.ci # needed by autofix.ci to securely identify the workflow

# Runs the pre-commit hooks on every pull request. Fixes the hooks make (whitespace,
# formatting, JSON layout) are pushed back as a commit by the autofix.ci app, then
# every hook is checked again, so this job fails on anything it could not fix.
# autofix.ci never edits files under .github/workflows, so fix those by hand.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  autofix:
    name: "Hooks: prek (autofix)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Covered by ci.yml.
      SKIP: mypy,pytest,no-push-to-main

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Apply hook fixes
        # A hook that rewrites a file exits non-zero; autofix.ci commits the rewrites.
        run: uv run prek run --all-files || true

      - name: Push fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "style: apply hook fixes"

      - name: Check hooks
        run: uv run prek run --all-files
