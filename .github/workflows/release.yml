name: Release

# Publishes a release's wheel and sdist to PyPI. Runs when a GitHub release is
# published for a CalVer tag (vYYYY.MM.PATCH) on main. The container image is
# publish.yml.
# PyPI accepts the upload through trusted publishing (OIDC), so no token is stored;
# see "Versions and releases" in CONTRIBUTING.md for the one-off setup.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: "Build: check the tag, build and test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the version and the main check
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false # no cache in a publishing workflow

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --dev --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check the tag is CalVer
        uses: samcorky/calver-scm@f267c4b971a27964d93e503c1a9ad4b17b496fad # v1.13.1
        with:
          command: validate
          tag: ${{ github.event.release.tag_name }}
          against-repo: "true"
          calver-scm-version: installed

      - name: Check the tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::$TAG is not on main; nothing is published."
            exit 1
          fi

      - name: Build and test the distributions
        run: uv run --frozen poe build-check

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: "Publish: PyPI"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aft-mcp
    permissions:
      id-token: write # trusted publishing
      attestations: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          ignore-empty-workdir: true

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        run: uv publish --trusted-publishing always dist/*
