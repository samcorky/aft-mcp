name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch replaces its older run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Fail rather than update uv.lock.
  UV_LOCKED: "1"

jobs:
  lint:
    name: "Lint: ruff + mypy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from git tags (hatch-vcs + calver-scm), so fetch them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run poe format-check

      - name: Lint
        run: uv run poe lint

      - name: Type-check
        run: uv run poe types

      - name: Check the shell scripts
        run: shellcheck -s sh deploy/ssh-broker/aft-mcp-broker tests/broker/entrypoint.sh

  tests:
    name: "Tests: Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    # The full suite includes tests/test_broker.py, which builds a container.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor and the newest Python, as calver-scm tests its range.
        # The one matching .python-version runs the full suite with coverage; the other
        # runs the fast suite. Update this list when the floor or the newest changes.
        python: ["3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from git tags (hatch-vcs + calver-scm), so fetch them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}

      - name: Set up Python ${{ matrix.python }}
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        # The full suite fails below the coverage floor (fail_under in pyproject.toml).
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          if [ "$PYTHON" = "$(cat .python-version)" ]; then
            uv run poe test
          else
            uv run poe test-fast
          fi

  build:
    name: "Build: wheel + sdist"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The Action below runs the calver-scm from uv.lock (the dev group), so
      # Renovate keeps the one version current.
      - name: Install dependencies
        run: |
          uv sync --dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Fails on a broken CalVer setup; warns about a shallow clone or no tag yet.
      # Both steps write their report to the job summary.
      - name: Check the CalVer setup
        uses: samcorky/calver-scm@f267c4b971a27964d93e503c1a9ad4b17b496fad # v1.13.1
        with:
          command: doctor
          calver-scm-version: installed

      - name: Show how the version was worked out
        uses: samcorky/calver-scm@f267c4b971a27964d93e503c1a9ad4b17b496fad # v1.13.1
        with:
          command: explain
          calver-scm-version: installed

      # Builds both distributions, then runs the tests against each installed one,
      # so a file left out of the wheel or sdist fails here rather than for users.
      - name: Build and test the distributions
        run: uv run poe build-check

  generated-files:
    name: "Generated files: settings reference"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from git tags (hatch-vcs + calver-scm), so fetch them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      # .env.example and docs/settings.md are generated from the Settings class.
      - name: Check the settings reference is current
        run: uv run poe settings-docs-check

  image:
    name: "Image: build and smoke test"
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  ci-passed:
    name: CI passed
    # The one check branch protection requires. It runs even when a needed job fails
    # or is cancelled, so it always reports; a skipped dependency would otherwise
    # leave it "skipped", which GitHub treats as passing.
    needs: [lint, tests, build, generated-files, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
