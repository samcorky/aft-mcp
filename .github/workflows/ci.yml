name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch replaces its older run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Fail rather than update uv.lock.
  UV_LOCKED: "1"

jobs:
  lint:
    name: "Lint: ruff + mypy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from git tags (hatch-vcs + calver-scm), so fetch them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run poe format-check

      - name: Lint
        run: uv run poe lint

      - name: Type-check
        run: uv run poe types

  tests:
    name: "Tests: pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from git tags (hatch-vcs + calver-scm), so fetch them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        # Fails below the coverage floor (fail_under in pyproject.toml).
        run: uv run poe test

  build:
    name: "Build: wheel + sdist"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Builds both distributions, then runs the tests against each installed one,
      # so a file left out of the wheel or sdist fails here rather than for users.
      - name: Build and test the distributions
        run: uv run poe build-check

  ci-passed:
    name: CI passed
    # The one check branch protection requires. It runs even when a needed job fails
    # or is cancelled, so it always reports; a skipped dependency would otherwise
    # leave it "skipped", which GitHub treats as passing.
    needs: [lint, tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job succeeded
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
