# Hooks are run by prek (https://github.com/j178/prek), a drop-in replacement for
# pre-commit that reads this file. Install them with `uv run poe init`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Without this, a hook with no `stages` of its own also runs on every push, repeating
# what the commit already ran. Only the commit-message and push hooks name a stage.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
      - id: check-added-large-files

  # Commit messages follow Conventional Commits; the types match .github/release.yml
  # and the PR labeller. Merge and fixup commits are allowed (no --strict).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, security, docs, ci, test, build, chore, refactor, style, revert]

  # AFT credentials live in .env; this stops them (or any other secret) being committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 3565c66f2d58f34041a13ebc6d4132c008e52a74 # frozen: 44.257.9
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        files: ^\.github/renovate\.json$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-github-issue-forms

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # no-commit-to-branch (above) cannot see a feature branch pushed to main.
      - id: no-push-to-main
        name: do not push to main
        entry: uv run --script scripts/no_push_to_main.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: settings-docs
        name: check the settings reference is current
        entry: uv run poe settings-docs-check
        language: system
        files: '^(src/aft_mcp/settings\.py|scripts/settings_reference\.py|\.env\.example|docs/settings\.md)$'
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run poe types
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run poe test-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
