[project]
name = "aft-mcp"
version = "0.1.0"
description = "An MCP server that gives AI agents safe, scoped access to AFT boards."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=4.1.4",
    "httpx2>=0.28.1",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
aft-mcp = "aft_mcp.server:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aft_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.poe.tasks]
init = { cmd = "prek install --force", help = "Install the git hooks (pre-commit, commit-msg and pre-push)" }
hooks = { cmd = "prek run --all-files", help = "Run every pre-commit hook on the whole repository" }
format-check = { cmd = "ruff format --check .", help = "Check formatting (as CI does)" }
lint = { cmd = "ruff check --no-fix .", help = "Lint without changing files" }
types = { cmd = "mypy", help = "Type-check with mypy" }
test = { cmd = "pytest", help = "Run the test suite with coverage" }
test-fast = { cmd = "pytest --no-cov -q -m \"not e2e\"", help = "Run the tests without coverage or e2e (used on pre-push)" }
check = { sequence = ["format-check", "lint", "types", "test"], help = "Run every CI check (ruff, mypy, pytest)" }
fmt = { cmd = "ruff format .", help = "Format code" }
lint-fix = { cmd = "ruff check --fix .", help = "Apply auto-fixable lint fixes" }
fix = { sequence = ["fmt", "lint-fix"], help = "Apply formatting and auto-fixable lint fixes" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: launches the server as a subprocess over stdio (slower; skipped on pre-push)",
]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source_pkgs = ["aft_mcp"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
fix = true
show-fixes = true
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "PT",  # flake8-pytest-style
    "ANN", # flake8-annotations
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    # Conflicts with the Ruff formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
    # Project-specific.
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D107", # missing docstring in __init__
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "`from __future__ import annotations` is banned; this project targets Python 3.14, where annotations are already lazily evaluated."

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "D", "ANN", "PT011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
python_version = "3.14"
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
pretty = true
